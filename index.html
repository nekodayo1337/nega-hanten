<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ネガ反転</title>
  <meta name="description" content="8mm などのカラーネガをスキャンした動画を、ブラウザの中でポジの色に直します。動画はどこにもアップロードされません。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>ネガ反転</h1>
      <p class="lead">カラーネガをスキャンした動画を、ふつうの色に直します。</p>
    </header>

    <section id="unsupported" class="card warn" hidden>
      <p><strong>このブラウザでは使えません。</strong></p>
      <p>Chrome か Safari の新しい版で開いてください。</p>
    </section>

    <section id="pick" class="card">
      <label id="drop" class="drop" for="file">
        <input id="file" type="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v">
        <span class="drop-main">動画をここにドラッグ＆ドロップ</span>
        <span class="drop-sub">またはクリックして選ぶ（MP4・MOV）</span>
      </label>
      <p class="note">動画はこの Mac の中だけで処理します。どこにもアップロードされません。</p>
    </section>

    <section id="work" class="card" hidden>
      <p class="file-name" id="fileName"></p>

      <div id="analyzing" class="status">
        <p>動画を調べています…</p>
        <div class="bar"><div class="bar-fill" id="analyzeBar"></div></div>
      </div>

      <div id="preview" hidden>
        <div class="compare">
          <figure><canvas id="before"></canvas><figcaption>元の動画</figcaption></figure>
          <figure><canvas id="after"></canvas><figcaption>直したあと</figcaption></figure>
        </div>
        <p class="hint" id="details"></p>
        <div class="actions">
          <button id="start" class="btn primary" type="button">この色で書き出す</button>
          <button class="btn reset" type="button">別の動画にする</button>
        </div>
      </div>

      <div id="encoding" class="status" hidden>
        <p id="encodeText">書き出しています…</p>
        <div class="bar"><div class="bar-fill" id="encodeBar"></div></div>
        <p class="hint">終わるまで、このタブは閉じないでください。</p>
      </div>

      <div id="done" hidden>
        <p class="ok">できました。</p>
        <div class="actions">
          <a id="save" class="btn primary" href="#" download>保存する</a>
          <button class="btn reset" type="button">別の動画にする</button>
        </div>
        <p class="hint" id="doneInfo"></p>
      </div>

      <div id="error" class="warn" hidden>
        <p id="errorText"></p>
        <div class="actions"><button class="btn reset" type="button">やり直す</button></div>
      </div>
    </section>

    <footer class="foot">
      <p>黒い帯の幅と色の範囲は、動画ごとに自動で測ります。</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
